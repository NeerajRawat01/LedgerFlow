[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ledgerflow-backend"
version = "0.1.0"
description = "LedgerFlow backend: financial consolidation and reporting platform"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115,<1.0",
    "uvicorn[standard]>=0.30,<1.0",
    "pydantic>=2.7,<3.0",
    "langgraph>=1.2,<2.0",
    "langchain-core>=1.7,<2.0",
    "langchain-google-genai>=4.4,<5.0",
    "langchain-groq>=0.3,<2.0",
    "mcp>=2.3,<3.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",
]

[tool.setuptools.packages.find]
include = ["app*"]
# Namespace packages (no __init__.py files in the app tree).
namespaces = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
